[project]
name = "cachebox-benchmark"
version = "0.1.0"
description = "Micro-benchmark suite comparing Python in-process cache libraries"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cachebox>=5.0.2",
    "cacheing>=0.1.1",
    "cachetools>=6.2.0",
    "lru-dict>=1.3.0",
    "matplotlib>=3.10.0",
    "matplotx>=0.3.10",
    "moka-py>=0.2.1",
    "psutil>=7.0.0",
]

[project.scripts]
cachebox-benchmark = "cachebox_benchmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cachebox_benchmark"]
